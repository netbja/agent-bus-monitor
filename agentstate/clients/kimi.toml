# Kimi CLI. The input box has a right border on screen: `│ >   …   │`. Kimi 2.1 reports
# idle/done while its moon spinner runs (`🌑 · Tip: …`).

client = "kimi"

[signature]
ansi = false
prompt = '^[ \t]*│ >'
rule_above = false
# Ready is anchored to the box's end (the empty `│ >` line directly above the bottom border): it is
# also the empty-input check, and a second input line must not read empty.
# box_end: the bottom border of the input box.
box_end = '^[ \t]*╰'
ready = ['(?m)^[ \t]*│ >[ \t]*(?:│[ \t]*)?\n[ \t]*╰']
busy = ['(?m)^[ \t]*(?:🌑|🌒|🌓|🌔|🌕|🌖|🌗|🌘)(?:[ \t]|·|$)']
modal = []
dialog = []
# Blocked: screen signatures only (no Kimi hooks); no menu captured yet (step 3).
blocked = []

# Background work: the process tree is to verify (step 3): not authoritative until then.
[background]
authoritative = []
helpers = []
screen = []
