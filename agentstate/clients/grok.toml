# Grok CLI.

client = "grok"

[signature]
ansi = false
prompt = '^[ \t]*│ ❯'
rule_above = false
# Ready is anchored to the box's end (the empty `│ ❯` line directly above the bottom border): it is
# also the empty-input check, and a second input line must not read empty.
# box_end: the bottom border of the input box.
box_end = '^[ \t]*╰'
ready = ['(?m)^[ \t]*│ ❯[ \t]*(?:│[ \t]*)?\n[ \t]*╰']
busy = []
modal = []
dialog = []
# Blocked: no menu captured yet; a permission hook is to verify (step 3).
blocked = []

# Background work: the subagent hooks are to verify, and the process tree is never authoritative (a
# shared leader process).
[background]
authoritative = []
helpers = []
screen = []

# The attach prefix (herdr exit spec 4.6, 4.9): F12 is not in the client's key table
# (verified offline in the spec; step 3's f12-at-input probe confirms it per version).
[keys]
f12 = "free"
