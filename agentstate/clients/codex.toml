# Codex CLI. `›` followed only by styling and spaces, then the dim placeholder. Transcript-scroll
# mode (footer `enter/esc latest`) does not submit on Enter. Dialog: screens/codex-hooks.txt.

client = "codex"

[signature]
ansi = true
prompt = '^›'
rule_above = false
# box_end: the first line out of the shaded input block (read raw: no background among its leading
# escapes); a blank line inside the input is shaded too, so it is not the end (reviewer-codex).
box_end = '^(?:\x1b\[(?:0|1|2|3[0-9;]*)m)*(?:[^\x1b]|$)'
ready = ['(?m)^(?:\x1b\[[0-9;]*m)*›(?:\x1b\[[0-9;]*m| )*\x1b\[2m']
busy = []
modal = ['enter/esc latest']
dialog = ['(?s)Hooks need review.*Trust all and continue']
# Blocked: a question menu, a line ending in "?" right above the `› 1.` selector (blank lines
# are not counted) and a second option `2.` below it, its question as "what" (the input line starts
# with `›` too: a typed "1. …" under a question is no menu, foureyes). Captured live 2026-11-16: the rate-limit menu
# "Approaching rate limits / Switch to <model> for lower credit usage? / › 1. Switch to …"
# (screens/codex-rate-limit.txt), which held reviewer-codex 15 minutes while the dispatcher read
# "unknown". The hooks review above is a Dialog (no question mark).
blocked = ['(?m)^[ \t]*(?P<what>[^\n]*\S\?)[ \t]*\n[ \t]*› 1\. [^\n]*\n[ \t]*2\. ']

# Background work: the process tree is never authoritative (tools run under a shared local
# app-server daemon); the subagent hooks and the "Background terminals" list are to verify (step 3).
[background]
authoritative = []
helpers = []
# Its own direct children, by name, with their subtrees (checked on codex-cli 0.169.0, 2026-11-21): the
# code-mode host and codebase-memory-mcp (/proc's comm, cut at 15 characters). Not direct_helpers: a
# one-command "bash -c" execs the program in place, so any unlisted direct child still counts. Not node
# either: Node 24 names every node process MainThread, codegraph's MCP server and a dev server alike.
helper_branches = ['^codex-code-mode$', '^codebase-memory$']
screen = []

# The attach prefix (herdr exit spec 4.6, 4.9): F12 free by the f12-at-input probe, codex-cli 0.169.0
# (agentbus term record codex f12-at-input, 2026-11-16, testdata/raw/codex/f12-at-input.jsonl):
# between the two presses (legacy, kitty) Codex only redraws the same frame; the input keeps abc.
[keys]
f12 = "free"
