# Codex CLI. `›` followed only by styling and spaces, then the dim placeholder. Transcript-scroll
# mode (footer `enter/esc latest`) does not submit on Enter. Dialog: screens/codex-hooks.txt.

client = "codex"

[signature]
ansi = true
prompt = '^›'
rule_above = false
# box_end: the first line out of the shaded input block (read raw: no background among its leading
# escapes); a blank line inside the input is shaded too, so it is not the end (reviewer-codex).
box_end = '^(?:\x1b\[(?:0|1|2|3[0-9;]*)m)*(?:[^\x1b]|$)'
ready = ['(?m)^(?:\x1b\[[0-9;]*m)*›(?:\x1b\[[0-9;]*m| )*\x1b\[2m']
busy = []
modal = ['enter/esc latest']
dialog = ['(?s)Hooks need review.*Trust all and continue']
# Blocked: no permission menu captured yet (step 3); the hooks review above is a Dialog.
blocked = []

# Background work: the process tree is never authoritative (tools run under a shared local
# app-server daemon); the subagent hooks and the "Background terminals" list are to verify (step 3).
[background]
authoritative = []
helpers = []
screen = []
