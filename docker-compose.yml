name: agent-bus

services:
  redis:
    image: redis:8-alpine
    container_name: agent-bus-redis
    # The password (redis-password): the shell's REDIS_PASSWORD when one is exported at
    # `docker compose up`, else the person's file (written 0600 by ./setup.sh install for a fresh
    # broker, or by ./setup.sh rotate-redis-password), else the historical default, the same
    # order as the clients. It reaches the server as a config on stdin, never on its argv.
    env_file:
      - path: ${XDG_CONFIG_HOME:-${HOME}/.config}/agentbus/redis.env
        required: false
    environment:
      AGENTBUS_SHELL_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        pw="$${AGENTBUS_SHELL_PASSWORD:-$${REDIS_PASSWORD:-AgentBus2025!}}"
        pw="$$(printf '%s' "$$pw" | sed 's/[\\"]/\\&/g')"
        exec redis-server - --appendonly yes <<EOF
        requirepass "$$pw"
        EOF
    ports:
      # loopback-only: the Redis password travels in plaintext, so the bus must
      # not be LAN-reachable. Remote access goes through an SSH tunnel (see README).
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${AGENTBUS_SHELL_PASSWORD:-$${REDIS_PASSWORD:-AgentBus2025!}}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
