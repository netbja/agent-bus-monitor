# The single role manifest (schema 2: execution settings live in [profiles.*], roles name one).
# Add a role by adding a [roles.<name>] table — no code change.
# <name> must match ValidName: ^[a-z][a-z0-9_-]{0,31}$ (lowercase, letter-first, <=32).
# Specialist roles to add on demand: examples/roles.specialists.toml.
# model: Claude Code's aliases (opus, sonnet, haiku) follow the latest model of each family, so a
# renamed model never breaks a launch. Write an exact id (claude-opus-5-5) only to pin a version;
# `agentbus roles doctor` shows what each agent really runs.
# pops = true: the role pops others; its session gets one Claude Code allow rule per role
# (`Bash(agent-spawn <role> *)`), or an ask rule for a role with approval = "person".
# approval = "person": that rule is an ask, so Claude Code asks the person in the popping agent's
# pane before it runs `agent-spawn <role>`. A convenience, not a lock. v0.17.
# Shared Claude Code denies apply to every role, including bypassPermissions. Defence in depth,
# not a boundary: processes an agent starts (tests, dotenv, and similar tools) can still read env.

schema_version = 2

[defaults]
profile = "claude-opus"

# One profile per model and permission the roles use. The launch is the one
# schema 1 gave (rolecfg/migration_test.go checks every role).
[profiles.claude-opus]
client = "claude-code"
provider = "anthropic"
model = "opus"
[profiles.claude-opus.options]
permission = "bypassPermissions"

[profiles.claude-opus-fallback]
client = "claude-code"
provider = "anthropic"
model = "opus"
[profiles.claude-opus-fallback.options]
permission = "bypassPermissions"
fallback = "claude-opus-5"

[profiles.claude-opus-manual]
client = "claude-code"
provider = "anthropic"
model = "opus"
[profiles.claude-opus-manual.options]
permission = "manual"

[profiles.claude-sonnet]
client = "claude-code"
provider = "anthropic"
model = "sonnet"
[profiles.claude-sonnet.options]
permission = "bypassPermissions"

[profiles.claude-sonnet-edits]
client = "claude-code"
provider = "anthropic"
model = "sonnet"
[profiles.claude-sonnet-edits.options]
permission = "acceptEdits"

[profiles.claude-haiku]
client = "claude-code"
provider = "anthropic"
model = "haiku"
[profiles.claude-haiku.options]
permission = "bypassPermissions"

# Other makers, for the busmon interface panel (ui-grok, ui-kimi). permission stays default:
# the client asks the person before each tool use. plan mode is not used: neither --help says
# whether it still runs the shell commands an agent needs to report on the bus.
[profiles.grok]
client = "grok"
provider = "xai"
model = "grok-4.6"

[profiles.kimi]
client = "kimi-cli"
provider = "moonshot"
model = "kimi-code/k3"

[tool_rules]
deny = [
  "Read(**/.env)", "Read(**/.env.local)", "Read(**/.env.production)", "Read(**/.env.development)",
  "Read(**/.env.test)", "Read(**/.env.staging)", "Read(**/.env.preview)",
  "Read(**/.env.production.local)", "Read(**/.env.development.local)", "Read(**/.env.test.local)",
  "Read(**/.env.staging.local)", "Read(**/.env.preview.local)",
  "Read(**/*.pem)", "Read(**/*.key)", "Read(**/id_rsa*)", "Read(**/id_ed25519*)",
  "Read(~/.ssh/**)", "Read(**/*keypair*.json)", "Read(**/wallet*.json)",
  "Edit(**/.env)", "Edit(**/.env.local)", "Edit(**/.env.production)", "Edit(**/.env.development)",
  "Edit(**/.env.test)", "Edit(**/.env.staging)", "Edit(**/.env.preview)",
  "Edit(**/.env.production.local)", "Edit(**/.env.development.local)", "Edit(**/.env.test.local)",
  "Edit(**/.env.staging.local)", "Edit(**/.env.preview.local)",
  "Edit(**/*.pem)", "Edit(**/*.key)", "Edit(**/id_rsa*)", "Edit(**/id_ed25519*)",
  "Edit(~/.ssh/**)", "Edit(**/*keypair*.json)", "Edit(**/wallet*.json)",
]

[roles.master]
profile = "claude-sonnet-edits"
tier = "boot"
pops = true
skills = ["agent-bus-master", "wayfinder", "to-tickets"]

[roles.coder]
profile = "claude-opus"
tier = "boot"
skills = ["agent-bus", "tdd", "implement"]

[roles.foureyes]
profile = "claude-opus"
tier = "boot"
skills = ["agent-bus", "code-review", "diagnosing-bugs"]

[roles.sentinel]
profile = "claude-haiku"
tier = "boot"
skills = ["agent-bus", "agent-bus-sentinel"]

[roles.architect]
profile = "claude-opus-fallback"
tier = "pop"
skills = ["agent-bus", "codebase-design", "domain-modeling", "to-spec"]

[roles.deploy]
profile = "claude-sonnet"
tier = "pop"
approval = "person"
skills = ["agent-bus", "diagnosing-bugs"]

[roles.security]
profile = "claude-opus-manual"
tier = "pop"
skills = ["agent-bus", "agent-bus-security"]

[roles.docs]
profile = "claude-sonnet-edits"
tier = "pop"
skills = ["agent-bus", "agent-bus-docs"]

# Interface advisors from other makers: they discuss busmon's next interface with the person
# and master, read-only, and never code.
[roles.ui-grok]
profile = "grok"
tier = "pop"
skills = ["agent-bus"]

[roles.ui-kimi]
profile = "kimi"
tier = "pop"
skills = ["agent-bus"]
