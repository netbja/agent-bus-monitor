# The single role manifest (schema 2: execution settings live in [profiles.*], roles name one).
# Add a role by adding a [roles.<name>] table — no code change.
# <name> must match ValidName: ^[a-z][a-z0-9_-]{0,31}$ (lowercase, letter-first, <=32).
# Specialist roles to add on demand: examples/roles.specialists.toml.
# model: Claude Code's aliases (opus, sonnet, haiku) follow the latest model of each family, so a
# renamed model never breaks a launch. Write an exact id (claude-opus-5-5) only to pin a version;
# `agentbus roles doctor` shows what each agent really runs.
# pops = true: the role pops others; its session gets one Claude Code allow rule per role
# (`Bash(agent-spawn <role> *)`), or an ask rule for a role with approval = "person".
# approval = "person": that rule is an ask, so Claude Code asks the person in the popping agent's
# pane before it runs `agent-spawn <role>`. A convenience, not a lock. v0.17.
# Shared Claude Code denies apply to every role, including bypassPermissions. Defence in depth,
# not a boundary: processes an agent starts (tests, dotenv, and similar tools) can still read env.

schema_version = 2

[defaults]
profile = "claude-opus"

# One profile per model and permission the roles use. The launch is the one
# schema 1 gave (rolecfg/migration_test.go checks every role).
[profiles.claude-opus]
client = "claude-code"
provider = "anthropic"
model = "opus"
[profiles.claude-opus.options]
permission = "bypassPermissions"

[profiles.claude-opus-fallback]
client = "claude-code"
provider = "anthropic"
model = "opus"
[profiles.claude-opus-fallback.options]
permission = "bypassPermissions"
fallback = "claude-opus-5"

[profiles.claude-opus-manual]
client = "claude-code"
provider = "anthropic"
model = "opus"
[profiles.claude-opus-manual.options]
permission = "manual"

[profiles.claude-sonnet]
client = "claude-code"
provider = "anthropic"
model = "sonnet"
[profiles.claude-sonnet.options]
permission = "bypassPermissions"

[profiles.claude-sonnet-edits]
client = "claude-code"
provider = "anthropic"
model = "sonnet"
[profiles.claude-sonnet-edits.options]
permission = "acceptEdits"

[profiles.claude-haiku]
client = "claude-code"
provider = "anthropic"
model = "haiku"
[profiles.claude-haiku.options]
permission = "bypassPermissions"

# Other makers, for the busmon interface panel (ui-grok, ui-kimi). permission stays default:
# the client asks the person before each tool use. plan mode is not used: neither --help says
# whether it still runs the shell commands an agent needs to report on the bus.
[profiles.grok]
client = "grok"
provider = "xai"
model = "grok-4.6"

[profiles.kimi]
client = "kimi-cli"
provider = "moonshot"
model = "kimi-code/k3"

# A second 4-eyes reviewer from another maker (reviewer-codex): the model table's openai frontier
# model on 2026-10-27, pinned so `roles field` and the shipped-manifest tests see it
# (`agentbus roles doctor` reports `newer` once the table states a successor).
# read-only: nothing in the checkout (nor coder's worktrees) is writable by the sandbox, which
# is what holds "never write", not the prompt. A review worktree, a test broker, a go test
# (GOCACHE is outside the writable roots anyway) and every bus call ask the person once each
# (approval on-request); so would any push. Same as examples/roles.mixed.toml [profiles.review].
[profiles.codex-review]
client = "codex"
provider = "openai"
model = "gpt-6-astra"
[profiles.codex-review.options]
sandbox = "read-only"
approval = "on-request"

[tool_rules]
deny = [
  "Read(**/.env)", "Read(**/.env.local)", "Read(**/.env.production)", "Read(**/.env.development)",
  "Read(**/.env.test)", "Read(**/.env.staging)", "Read(**/.env.preview)",
  "Read(**/.env.production.local)", "Read(**/.env.development.local)", "Read(**/.env.test.local)",
  "Read(**/.env.staging.local)", "Read(**/.env.preview.local)",
  "Read(**/*.pem)", "Read(**/*.key)", "Read(**/id_rsa*)", "Read(**/id_ed25519*)",
  "Read(~/.ssh/**)", "Read(**/*keypair*.json)", "Read(**/wallet*.json)",
  "Edit(**/.env)", "Edit(**/.env.local)", "Edit(**/.env.production)", "Edit(**/.env.development)",
  "Edit(**/.env.test)", "Edit(**/.env.staging)", "Edit(**/.env.preview)",
  "Edit(**/.env.production.local)", "Edit(**/.env.development.local)", "Edit(**/.env.test.local)",
  "Edit(**/.env.staging.local)", "Edit(**/.env.preview.local)",
  "Edit(**/*.pem)", "Edit(**/*.key)", "Edit(**/id_rsa*)", "Edit(**/id_ed25519*)",
  "Edit(~/.ssh/**)", "Edit(**/*keypair*.json)", "Edit(**/wallet*.json)",
  # No agent reloads as a person (lifecycle part C): --as skips reload's caller
  # table and AGENT_BUS_RELOAD's opt-outs. Defence in depth, not a boundary:
  # the client matches command text, and a person's own shell is not affected.
  "Bash(agentbus reload *--as*)", "Bash(agentbus * reload *--as*)",
]

[roles.master]
profile = "claude-sonnet-edits"
tier = "boot"
pops = true
skills = ["agent-bus-master", "wayfinder", "to-tickets"]
# The person, 2026-10-27: master relaunches this project's dead agents without a prompt.
# Exact commands only: no other project, no other flag, no wildcard.
[roles.master.tool_rules]
# Lifecycle part C: master reloads sentinel, and only sentinel.
allow = ["Bash(agentbus up agent-bus-monitor --resume)", "Bash(agentbus up agent-bus-monitor --resume --dry-run)",
  "Bash(agentbus reload sentinel)", "Bash(agentbus reload sentinel --dry-run)"]

[roles.coder]
profile = "claude-opus"
tier = "boot"
skills = ["agent-bus", "tdd", "implement"]

[roles.foureyes]
profile = "claude-opus"
tier = "boot"
skills = ["agent-bus", "code-review", "diagnosing-bugs"]

[roles.sentinel]
profile = "claude-haiku"
tier = "boot"
skills = ["agent-bus", "agent-bus-sentinel"]
# Lifecycle part C: sentinel reloads agents on a client-update episode. The
# command checks who and when from AGENT_BUS_AGENT and the bus facts, but it
# cannot prove who runs it: an agent passing --as <person> skips the table.
# This allow only spares the prompt.
[roles.sentinel.tool_rules]
allow = ["Bash(agentbus reload *)"]

[roles.architect]
profile = "claude-opus-fallback"
tier = "pop"
skills = ["agent-bus", "codebase-design", "domain-modeling", "to-spec"]

[roles.deploy]
profile = "claude-sonnet"
tier = "pop"
approval = "person"
skills = ["agent-bus", "diagnosing-bugs"]

[roles.security]
profile = "claude-opus-manual"
tier = "pop"
skills = ["agent-bus", "agent-bus-security"]

[roles.docs]
profile = "claude-sonnet-edits"
tier = "pop"
skills = ["agent-bus", "agent-bus-docs"]

# Interface advisors from other makers: they discuss busmon's next interface with the person
# and master, read-only, and never code.
[roles.ui-grok]
profile = "grok"
tier = "pop"
skills = ["agent-bus"]

[roles.ui-kimi]
profile = "kimi"
tier = "pop"
skills = ["agent-bus"]

# A second independent reviewer from another maker, popped when another 4-eyes is needed.
# Never codes; read-only on the repository.
[roles.reviewer-codex]
profile = "codex-review"
tier = "pop"
skills = ["agent-bus"]

# Drafted by master for: infrastructure as code and IT automation: Ansible playbooks and roles, Terraform and OpenTofu plans, linting, drift checks, IT support; check plan diff lint freely, apply or destroy only after the person says yes, never secrets
[roles.infra]
profile = "claude-opus-manual"
tier = "pop"
approval = "person"
skills = ["agent-bus", "diagnosing-bugs"]

# Least privilege (infra-role, master's classes). The profile is manual: every
# command prompts in the pane unless a rule below says otherwise. A defence in
# depth, not a boundary: the client matches command text only, deny before ask
# before allow.
[roles.infra.tool_rules]
# Exact invocations only (master): no wildcard, so no extra flag or argument
# rides on an allow (`fmt -check=false` writes files: it prompts). These change
# nothing; validate and tflint run the provider binaries and plugins the person
# approved at init and tflint --init (both asked). Anything else prompts in the
# manual pane or is asked below: the person approves everything that runs IaC.
allow = [
  "Bash(terraform fmt -check)", "Bash(terraform fmt -check -recursive)", "Bash(terraform validate)",
  "Bash(tofu fmt -check)", "Bash(tofu fmt -check -recursive)", "Bash(tofu validate)",
  "Bash(tflint)", "Bash(tflint --recursive)", "Bash(ansible-lint --offline)", "Bash(yamllint .)",
]
# The person approves each: what evaluates providers, modules or data sources
# (a data "external" runs a program during a plan), what touches a target
# (--check still runs check_mode: false tasks; test applies real resources by
# default; ad-hoc ansible), downloads (init, get, tflint --init, ansible-galaxy,
# ansible-pull), and every change (apply, destroy, import, taint, state surgery,
# force-unlock, workspace: delete -force drops state while resources live on),
# and every ansible-playbook run (--check and --syntax-check included). Each verb is one pattern per tool, `terraform *<verb>*`, so the
# -chdir= forms match too; it may over-ask (a path holding the word), never
# under-ask. An ask rule also refuses a bypassPermissions profile.
ask = [
  "Bash(terraform *plan*)", "Bash(terraform *init*)", "Bash(terraform *refresh*)", "Bash(terraform *get*)",
  "Bash(terraform *import*)", "Bash(terraform *taint*)", "Bash(terraform *apply*)", "Bash(terraform *destroy*)",
  "Bash(terraform *state *)", "Bash(terraform *force-unlock*)", "Bash(terraform *test*)", "Bash(terraform *workspace*)",
  "Bash(tofu *plan*)", "Bash(tofu *init*)", "Bash(tofu *refresh*)", "Bash(tofu *get*)",
  "Bash(tofu *import*)", "Bash(tofu *taint*)", "Bash(tofu *apply*)", "Bash(tofu *destroy*)",
  "Bash(tofu *state *)", "Bash(tofu *force-unlock*)", "Bash(tofu *test*)", "Bash(tofu *workspace*)",
  "Bash(tflint *--init*)", "Bash(ansible-lint *--fix*)", "Bash(ansible-lint *--write*)",
  "Bash(ansible-playbook*)",
  "Bash(ansible *)", "Bash(ansible-pull*)", "Bash(ansible-galaxy *)",
]
# Never a secret: state and plan files (every value in clear), variable files,
# vault passwords, cloud and cluster credentials, and the commands that print
# state, outputs or the environment (state pull and state show print every
# secret: denied, while the other state subcommands are asked), and
# workspace new -state=, which copies a state file through the CLI (a Read deny
# does not reach a subprocess). `env *` also
# closes `env VAR=x terraform apply`, which would start outside the ask rules.
deny = [
  "Read(**/*.tfstate*)", "Read(**/.terraform/**)", "Read(**/*.tfplan)", "Read(**/*.tfvars*)", "Read(~/.terraform.d/**)",
  "Read(**/*vault_pass*)", "Read(**/.vault_pass*)", "Bash(ansible-vault *)",
  "Read(~/.aws/**)", "Read(~/.config/gcloud/**)", "Read(~/.azure/**)", "Read(~/.kube/**)", "Read(~/.docker/config.json)",
  "Bash(terraform output*)", "Bash(terraform show*)", "Bash(terraform console*)", "Bash(terraform state pull*)", "Bash(terraform state show*)",
  "Bash(terraform -chdir=* output*)", "Bash(terraform -chdir=* show*)", "Bash(terraform -chdir=* console*)",
  "Bash(terraform -chdir=* state pull*)", "Bash(terraform -chdir=* state show*)",
  "Bash(tofu output*)", "Bash(tofu show*)", "Bash(tofu console*)", "Bash(tofu state pull*)", "Bash(tofu state show*)",
  "Bash(tofu -chdir=* output*)", "Bash(tofu -chdir=* show*)", "Bash(tofu -chdir=* console*)",
  "Bash(tofu -chdir=* state pull*)", "Bash(tofu -chdir=* state show*)",
  "Bash(terraform *plan*-out*)", "Bash(tofu *plan*-out*)",
  "Bash(terraform *workspace new*-state*)", "Bash(tofu *workspace new*-state*)",
  "Bash(printenv*)", "Bash(env)", "Bash(env *)",
]
