# Copy to your project, set model IDs/aliases available on YOUR accounts, then:
# ROLES_TOML=/absolute/path/roles.toml AGENT_LAUNCH_DRYRUN=1 agent-launch coder demo
# No reasoning override: keep the client/provider default for every role.
schema_version = 2

[defaults]
profile = "claude"

[profiles.claude]
client = "claude-code"
provider = "anthropic"
model = "sonnet"   # an alias follows the latest Sonnet; an exact id pins one version
[profiles.claude.options]
permission = "acceptEdits"

[profiles.review]
client = "codex"
provider = "openai"
# A tier instead of a model: each launch takes the provider's current frontier model from the
# model table (agentbus models), so a renamed model never breaks it. `model = "<id>"` pins one.
tier = "frontier"
[profiles.review.options]
sandbox = "read-only"
approval = "on-request"

[profiles.kimi]
client = "kimi-cli"
# Informational here: the native Kimi model alias selects its configured provider.
provider = "moonshot"
model = "your-kimi-model-alias"

# agy (Antigravity CLI, Google): a reviewer or panelist from another maker. permission stays
# default: the session pins toolPermission=request-review and empties your agy allows
# (agy-client spec §4.4). Keep a Gemini model: a claude-* row agy also serves would review
# Anthropic's work with Anthropic's model. Sign in once with `agy` by hand first.
[profiles.agy-review]
client = "agy"
provider = "google"
model = "gemini-3.8-flash-high"   # an id as `agy models` prints it
[profiles.agy-review.options]
sandbox = true

[roles.master]
tier = "boot"
required = true
skills = ["agent-bus-master", "wayfinder", "to-tickets"]
delivers = true
[roles.master.tool_rules]
allow = ["Bash(agentbus deliver *)"]

[roles.coder]
tier = "boot"
required = true
skills = ["agent-bus", "tdd", "implement"]
# When anthropic is out for long, master may ask you to swap coder (agentbus swap, v0.15).
# At most 3, each on another provider; `agentbus roles fallbacks coder` lists them.
# fallback_profiles = ["review"]
[roles.coder.tool_rules]
deny = ["Bash(agentbus deliver *)"]

[roles.foureyes]
profile = "review"
tier = "boot"
required = true
skills = ["agent-bus", "code-review", "diagnosing-bugs"]
# fallback_profiles = ["kimi"]   # on claude it would share coder's provider: less diversity
[roles.foureyes.tool_rules]
deny = ["Bash(agentbus deliver *)"]

[roles.sentinel]
profile = "kimi"
tier = "boot"
required = true
skills = ["agent-bus", "agent-bus-sentinel"]
[roles.sentinel.tool_rules]
deny = ["Bash(agentbus deliver *)"]

[roles.architect]
tier = "pop"
skills = ["agent-bus", "codebase-design", "domain-modeling", "to-spec"]
[roles.architect.tool_rules]
deny = ["Bash(agentbus deliver *)"]

[roles.deploy]
tier = "pop"
skills = ["agent-bus", "diagnosing-bugs"]
[roles.deploy.tool_rules]
deny = ["Bash(agentbus deliver *)"]

[roles.security]
profile = "review"
tier = "pop"
skills = ["agent-bus", "agent-bus-security"]
[roles.security.tool_rules]
deny = ["Bash(agentbus deliver *)"]

[roles.docs]
tier = "pop"
skills = ["agent-bus", "agent-bus-docs"]
delivers = true
[roles.docs.tool_rules]
allow = ["Bash(agentbus deliver *)"]
